name: Keep Supabase awake

# Makes one tiny database read every 3 days so the free Supabase project
# doesn't get paused for inactivity. Safe to run any time (Actions tab -> Run workflow).
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row from the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -e
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/players?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY")
          echo "HTTP $code"
          # 200 = fine; 401/403 still reaches the database layer, so also counts. Only fail if unreachable.
          case "$code" in 2*|401|403) exit 0;; *) exit 1;; esac
